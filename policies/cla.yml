name: Contributor License Agreement Policy
description: Microsoft CLA policy for kaimahi-agents repositories

resource: repository

configuration:
  cla:
    content: https://raw.githubusercontent.com/microsoft/.github/main/CLA/microsoft.yml
    minimalChangeRequired:
      files: 2
      codeLines: 16
    bypassUsers:
      - dependabot[bot]
      - github-actions[bot]
      - microsoft-github-policy-service[bot]
    prohibitedCompanies:
      - msft
    autoSignMsftEmployee: true
